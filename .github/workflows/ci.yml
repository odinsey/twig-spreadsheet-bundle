name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / Twig ${{ matrix.twig }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['5.4.*', '6.4.*', '7.*']
        twig: ['3.12.*', '3.*']
        exclude:
          # Symfony 7 requires PHP >= 8.2
          - php: '8.1'
            symfony: '7.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, xml, gd, mbstring
          coverage: none

      - name: Select Symfony and Twig versions
        run: |
          composer config audit.block-insecure false
          composer require --no-update --dev "symfony/symfony:${{ matrix.symfony }}" "symfony/phpunit-bridge:${{ matrix.symfony }}"
          composer require --no-update "twig/twig:${{ matrix.twig }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/simple-phpunit | tee phpunit.log

      - name: No deprecation of the bundle's Twig visitors / expression parser
        run: "! grep -E 'AbstractNodeVisitor|getExpressionParser|Twig.ExpressionParser' phpunit.log"
